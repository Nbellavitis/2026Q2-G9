q:
  # Next picks 3001 when 3000 is already taken, and a dev server that quietly moves port is a
  # confusing way to discover a CORS rule. Permit both local origins.
  cors-allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}
  realtime:
    mode: POSTGRES
  notifications:
    email:
      enabled: true
  seed:
    enabled: true

logging:
  level:
    ar.edu.itba.cloud.queue: DEBUG
    org.hibernate.SQL: DEBUG
