# Despliegue de Queue con Terraform.
#
# Todo el ciclo corre desde el pull request, porque el PR de la entrega no se mergea antes de la
# corrección y GitHub solo ofrece "Run workflow" (workflow_dispatch) para workflows que ya están en
# la rama por defecto:
#
#   cada push al PR          validate y build; con credenciales, también plan
#   aprobar el environment   apply sobre ese mismo plan, y prueba de humo
#   etiqueta "destroy"       destroy (también aprobado)
#
# Las credenciales del Learner Lab vencen con cada sesión: antes de correr, hay que actualizar los
# secrets AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY y AWS_SESSION_TOKEN.

name: Terraform

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      action:
        description: Qué hacer
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read
  pull-requests: write

# Un solo estado: dos ejecuciones a la vez se pisarían. El lockfile de S3 lo impediría igual, pero
# esperar en la cola es mejor que fallar.
concurrency:
  group: terraform-state
  cancel-in-progress: false

env:
  TF_VERSION: 1.16.4
  TFLINT_VERSION: v0.64.0
  NODE_VERSION: 22
  AWS_REGION: us-east-1
  TF_DIR: infra/terraform
  # Tiene que coincidir con var.api_stage_name: el frontend se compila con esta ruta base.
  API_STAGE: prod
# Con `shell: bash` explícito, GitHub agrega pipefail: un `terraform plan | tee` que falla, falla.
defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validar
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Formato
        run: terraform fmt -check -recursive -diff
        working-directory: ${{ env.TF_DIR }}

      - name: Validación
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - uses: terraform-linters/setup-tflint@v6.3.1
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tflint
        working-directory: ${{ env.TF_DIR }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --format compact

  build:
    name: Compilar
    if: github.event.action != 'labeled' || github.event.label.name == 'destroy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            frontend/package-lock.json

      - name: Funciones
        working-directory: functions
        run: |
          npm ci
          npm run typecheck
          npm run build

      # Los unitarios del dominio y los de integración contra DynamoDB Local (Testcontainers usa el
      # Docker que ya trae el runner). Incluyen las carreras del control optimista: si alguna se
      # rompe, no se despliega. Al destruir no corren: un test roto no puede impedir limpiar la cuenta.
      - name: Tests de las funciones
        if: github.event.action != 'labeled' && inputs.action != 'destroy'
        working-directory: functions
        run: npm test

      - name: Sitio
        working-directory: frontend
        env:
          # La API REST antepone el stage a cada ruta, y el sitio y la API comparten la URL.
          NEXT_PUBLIC_BASE_PATH: /${{ env.API_STAGE }}
          NEXT_PUBLIC_API_URL: /${{ env.API_STAGE }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: build
          retention-days: 1
          if-no-files-found: error
          path: |
            functions/dist
            frontend/out

  plan:
    name: Plan
    needs: [validate, build]
    if: >-
      (github.event_name == 'pull_request' && github.event.action != 'labeled') ||
      (github.event_name == 'workflow_dispatch' && inputs.action != 'destroy')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.1
        with:
          name: build

      - uses: ./.github/actions/terraform-init
        with:
          terraform-version: ${{ env.TF_VERSION }}
          working-directory: ${{ env.TF_DIR }}
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan -input=false -no-color -out=tfplan | tee plan.txt
          {
            echo '## Plan de Terraform'
            echo '```'
            grep -E '^(Plan:|No changes|Changes to Outputs)' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # El apply corre en otro runner y usa este mismo plan. Los zips de las funciones van con él:
      # el plan los referencia y en el otro runner no existirían.
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: tfplan
          retention-days: 1
          include-hidden-files: true
          path: |
            ${{ env.TF_DIR }}/tfplan
            ${{ env.TF_DIR }}/plan.txt
            ${{ env.TF_DIR }}/.build

      - name: Comentar el plan en el PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9.0.0
        env:
          PLAN_FILE: ${{ env.TF_DIR }}/plan.txt
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- terraform-plan -->'
            const plan = fs.readFileSync(process.env.PLAN_FILE, 'utf8')
            const limit = 60000
            const shown = plan.length > limit ? plan.slice(-limit) : plan
            const body = [
              marker,
              '### Plan de Terraform',
              `Commit \`${context.payload.pull_request.head.sha.slice(0, 7)}\`. Para aplicarlo, aprobar el environment \`aws-lab\` en la ejecución.`,
              '<details><summary>Ver el plan</summary>',
              '',
              '```',
              shown,
              '```',
              '</details>',
            ].join('\n')
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const previous = comments.find((comment) => comment.body?.startsWith(marker))
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

  apply:
    name: Apply
    needs: plan
    if: >-
      (github.event_name == 'pull_request' && github.event.action != 'labeled') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    runs-on: ubuntu-latest
    # Con revisores obligatorios configurados en el repositorio, el apply espera una aprobación.
    environment: aws-lab
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.1
        with:
          name: build

      - uses: actions/download-artifact@v8.0.1
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}

      - uses: ./.github/actions/terraform-init
        with:
          terraform-version: ${{ env.TF_VERSION }}
          working-directory: ${{ env.TF_DIR }}
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      # La prueba del tiempo real usa el WebSocket que Node trae desde la versión 22.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -no-color tfplan

      - name: Prueba de humo
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          site=$(terraform output -raw site_url)
          health=$(terraform output -raw health_url)
          api="${site}api/v1"

          # Un deployment nuevo de API Gateway tarda unos segundos en propagarse.
          for attempt in $(seq 1 10); do
            if curl -fsS "$health"; then break; fi
            if [ "$attempt" -eq 10 ]; then echo "La API no respondió"; exit 1; fi
            sleep 6
          done
          echo

          curl -fsS "$site" | grep -qi '<html' || { echo "La portada no devolvió HTML"; exit 1; }
          curl -fsS -o /dev/null "${site}login/" || { echo "La página de login no cargó"; exit 1; }
          curl -fsS "${site}config.json" | jq -e '.userPoolId and .userPoolClientId' >/dev/null \
            || { echo "config.json no tiene los ids de Cognito"; exit 1; }

          # El recorrido de un cliente en la cola de demo: unirse, ver su ticket e irse.
          demo=$(terraform output -raw demo_queue_url 2>/dev/null || true)
          if [ -n "$demo" ]; then
            queue_id="${demo##*id=}"
            status=$(curl -sS -o join.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
              -d '{"name":"Prueba de humo","email":"humo@queue.example","partySize":2,"locale":"es"}' \
              "${api}/public/queues/${queue_id}/entries")
            [ "$status" = "201" ] || { echo "Unirse a la cola de demo respondió $status"; cat join.json; exit 1; }
            token=$(jq -r .ticketToken join.json)
            curl -fsS "${api}/public/tickets/${token}" | jq -e '.status == "WAITING"' >/dev/null \
              || { echo "El ticket no quedó esperando"; exit 1; }
            # Irse de la cola con el WebSocket abierto: el aviso tiene que llegar por el push.
            node ../../.github/scripts/smoke-realtime.mjs "$(terraform output -raw websocket_url)" "$token" "$api"
          fi

          {
            echo '## Desplegado'
            echo "- Sitio: $site"
            echo "- Salud: $health"
            if [ -n "$demo" ]; then
              echo "- Cola de demo: $demo"
              echo "- Staff de demo: $(terraform output -raw demo_staff_email) (contraseña: \`terraform output -raw demo_staff_password\`)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  destroy:
    name: Destroy
    needs: build
    if: >-
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'destroy') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'destroy')
    runs-on: ubuntu-latest
    environment: aws-lab
    steps:
      - uses: actions/checkout@v7.0.1

      # Destroy también evalúa la configuración, y los zips de las funciones se leen en el plan.
      - uses: actions/download-artifact@v8.0.1
        with:
          name: build

      - uses: ./.github/actions/terraform-init
        with:
          terraform-version: ${{ env.TF_VERSION }}
          working-directory: ${{ env.TF_DIR }}
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Destroy
        working-directory: ${{ env.TF_DIR }}
        run: terraform destroy -input=false -no-color -auto-approve
